<style>
/* =====================================================================

:root{

html.no-webfont .ls{letter-spacing:normal}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

.frame{
  width:100%;max-width:390px;

  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:30px;
}

/* ---------- 로고 ---------- */
.logo{height:20px;width:auto}

/* ---------- 카피 ---------- */
.copy{text-align:center;display:flex;flex-direction:column;align-items:center}
.copy .l1{
  display:block;font-size:24px;font-weight:400;color:#fff;
  letter-spacing:-.6px;line-height:34px;
}
.copy .l2{
  display:block;font-size:32px;font-weight:600;color:var(--purple);
  letter-spacing:-.8px;line-height:44.8px;
}
.copy .sub span{
  display:block;font-size:14px;font-weight:400;color:rgba(255,255,255,.6);
  letter-spacing:-.35px;line-height:22px;
}

/* ---------- 다운로드 버튼 ---------- */
.stores{display:flex;gap:10px;align-items:center;width:100%;justify-content:center}
.store{
  width:160px;max-width:calc(50% - 5px);
  padding:5px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  overflow:hidden;border:1px solid transparent;
  transition:transform .14s ease, opacity .14s ease;
}
.store:active{transform:scale(.97)}
.store:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
.store .ico{flex:none;display:block}
.store .tx{text-align:left;white-space:nowrap;letter-spacing:-.3px}
.store .tx small{display:block;font-size:12px;font-weight:400;line-height:1.1}
.store .tx strong{display:block;font-size:15px;font-weight:700;line-height:1.1}

.store--ios{background:#fff;color:#000}
.store--ios .tx small{color:rgba(0,0,0,.6)}
.store--aos{background:#000;border-color:rgba(255,255,255,.6);color:#fff}
.store--aos .tx small{color:rgba(255,255,255,.6)}

/* ---------- 폰 이미지 ---------- */
.phone{
  width:266px;max-width:74vw;aspect-ratio:266/335.31;
  overflow:hidden;flex:none;
}
.phone img{width:100%;height:100%;object-fit:contain}

/* ---------- 푸터 ---------- */
.foot{
  display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;
  font-size:11.5px;letter-spacing:-.29px;color:rgba(255,255,255,.32);line-height:1.5;
}
.foot a:hover{color:rgba(255,255,255,.7)}

/* ---------- 자동 이동 안내 ---------- */
.gate{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:32px;
}
.gate.on{display:flex}
.gate p{font-size:14px;letter-spacing:-.35px;color:rgba(255,255,255,.72)}
.gate button{
  font:inherit;font-size:13px;font-weight:500;letter-spacing:-.33px;
  color:rgba(255,255,255,.5);background:none;border:none;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;
}
.gate .dots i{
  display:inline-block;width:7px;height:7px;border-radius:99px;margin:0 3px;
  background:var(--orange);animation:blink 1.1s infinite;
}
.gate .dots i:nth-child(2){background:var(--pink);animation-delay:.16s}
.gate .dots i:nth-child(3){background:var(--purple);animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<body>

</div>

<div class="gate" id="gate" role="status" aria-live="polite">

  <p id="gate-msg">스토어로 이동 중입니다…</p>
  <button type="button" id="gate-cancel">이동하지 않고 페이지 보기</button>
</div>

<script>
/* =====================================================================
   여기 값만 바꾸면 됩니다
   ===================================================================== */
var CONFIG = {
  IOS_URL : 'https://apps.apple.com/kr/app/id6783352967',
  AOS_URL : 'https://play.google.com/store/apps/details?id=com.ongs.app',

  PRIVACY_URL : '',            /* 개인정보처리방침 주소 — 비우면 링크 자동 숨김 */
  CONTACT_MAIL: '',            /* 문의 이메일 — 비우면 링크 자동 숨김 */

  GA_ID : 'G-RWEYC4B4NX',      /* 구글 애널리틱스 측정 ID (G-로 시작) */

  AUTO_REDIRECT : true,        /* true = 접속 즉시 기기에 맞는 스토어로 이동. ?stay=1 링크는 페이지만 보여줌 */
  AUTO_DELAY_MS : 600,

  EMPHASIZE_BY_OS : false      /* true = 안드로이드 접속자에게 안드 버튼을 앞으로 */
};

/* =====================================================================
   아래는 수정 불필요
   ===================================================================== */
(function () {
  'use strict';

  /* ---------- 폰트 방어 : 실제 렌더 폭을 재서 판별 ---------- */
  (function guardFont(){
    function widthOf(family){
      var s = document.createElement('span');
      s.style.cssText = 'position:absolute;left:-9999px;top:-9999px;white-space:nowrap;'
                      + 'font-size:100px;font-weight:700;letter-spacing:normal;font-family:' + family;
      s.textContent = '광고없이공수입력1초면끝';
      document.body.appendChild(s);
      var w = s.offsetWidth;
      s.parentNode.removeChild(s);
      return w;
    }
    function verify(){
      var base = widthOf('monospace');
      var real = widthOf('"PretendardSub","Pretendard Variable",Pretendard,monospace');
      if (real === base) document.documentElement.classList.add('no-webfont');
    }
    if (document.fonts && document.fonts.ready) {
      var t = setTimeout(verify, 2500);
      document.fonts.ready.then(function(){ clearTimeout(t); verify(); });
    } else {
      window.addEventListener('load', verify);
    }
  })();

  var qs = new URLSearchParams(location.search);

  /* ---------- 기기 판별 ---------- */
  function detectOS() {
    var ua = navigator.userAgent || '';
    if (/android/i.test(ua)) return 'android';
    if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
    return 'other';
  }
  var os = detectOS();

  /* ---------- 유입 경로 : ?from=insta 처럼 붙이면 채널이 나뉨 ---------- */
  var source = qs.get('from') || qs.get('utm_source') || 'direct';

  /* ---------- 구글 애널리틱스 ---------- */
  var gaReady = false;
  window.dataLayer = window.dataLayer || [];
  function gtag(){ window.dataLayer.push(arguments); }

  if (CONFIG.GA_ID) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.GA_ID;
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', CONFIG.GA_ID, { send_page_view: true });
    gaReady = true;
  }

  function track(name, params, done) {
    var payload = Object.assign({ detected_os: os, source: source }, params || {});
    if (!gaReady) { console.log('[track]', name, payload); if (done) done(); return; }
    var fired = false;
    function go(){ if (!fired) { fired = true; if (done) done(); } }
    payload.event_callback = go;
    payload.transport_type = 'beacon';
    gtag('event', name, payload);
    setTimeout(go, 450);
  }

  track('landing_view');

  /* ---------- 버튼 ---------- */
  var btnIOS = document.getElementById('btn-ios');
  var btnAOS = document.getElementById('btn-aos');
  btnIOS.href = CONFIG.IOS_URL;
  btnAOS.href = CONFIG.AOS_URL;

  if (CONFIG.EMPHASIZE_BY_OS && os === 'android') {
    btnAOS.parentNode.insertBefore(btnAOS, btnIOS);
  }

  function storeURL(w){ return w === 'android' ? CONFIG.AOS_URL : CONFIG.IOS_URL; }

  [btnIOS, btnAOS].forEach(function (el) {
    el.addEventListener('click', function (e) {
      var which = el.dataset.store;
      e.preventDefault();
      track('store_click', { store: which, auto: false }, function () {
        location.href = storeURL(which);
      });
    });
  });

  /* ---------- 자동 이동 ---------- */
  var forced  = qs.get('go') === '1';
  var stay    = qs.get('stay') === '1';   /* ?stay=1 → 자동 이동 없이 페이지만 보여줌 */
  var stopped = false;

  /* 스토어로 보낸 뒤 뒤로가기로 돌아왔을 때 다시 튕기지 않도록 표시해 둔다.
     이 표시가 없으면 뒤로가기 → 자동이동 → 뒤로가기 무한 반복이 된다. */
  var SENT = 'ongs_sent';
  function markSent(){ try { sessionStorage.setItem(SENT, '1'); } catch (e) {} }
  function alreadySent(){ try { return sessionStorage.getItem(SENT) === '1'; } catch (e) { return false; } }

  var shouldGo = (CONFIG.AUTO_REDIRECT || forced)
              && !stay
              && !alreadySent()
              && (os === 'ios' || os === 'android');

  if (shouldGo) {
    var gate = document.getElementById('gate');
    gate.classList.add('on');
    document.getElementById('gate-cancel').addEventListener('click', function () {
      stopped = true;
      markSent();
      gate.classList.remove('on');
    });
    setTimeout(function () {
      if (stopped) return;
      markSent();
      track('store_click', { store: os, auto: true }, function () {
        if (!stopped) location.href = storeURL(os);
      });
    }, CONFIG.AUTO_DELAY_MS);
    setTimeout(function () {
      if (stopped) return;
      gate.classList.remove('on');
    }, CONFIG.AUTO_DELAY_MS + 3500);
  }

  /* 뒤로가기로 돌아왔을 때(브라우저 캐시 복원) 안내 화면이 남아있지 않게 정리 */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      var g = document.getElementById('gate');
      if (g) g.classList.remove('on');
    }
  });

  /* ---------- 푸터 링크 ---------- */
  var pv = document.getElementById('lnk-privacy');
  var ct = document.getElementById('lnk-contact');
  if (CONFIG.PRIVACY_URL) { pv.href = CONFIG.PRIVACY_URL; pv.target = '_blank'; pv.rel = 'noopener'; }
  else { pv.style.display = 'none'; }
  if (CONFIG.CONTACT_MAIL) { ct.href = 'mailto:' + CONFIG.CONTACT_MAIL; }
  else { ct.style.display = 'none'; }
})();
</script>
