<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">

<title>친구가 오늘공수에 초대했어요</title>
<meta name="description" content="가입하고 공수 1번 저장하면 포인트를 받아요">

<!-- 미리보기 대표 주소 태그는 일부러 넣지 않는다. 카카오톡이 그 주소로 보내면 ?c=코드 가 떨어져 자동 연결이 깨진다. -->
<meta property="og:type"         content="website">
<meta property="og:site_name"    content="오늘공수">
<meta property="og:title"        content="친구가 오늘공수에 초대했어요">
<meta property="og:description"  content="가입하고 공수 1번 저장하면 포인트를 받아요">
<meta property="og:image"        content="https://www.ongs1.co.kr/assets/og-invite.png">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="친구가 오늘공수에 초대했어요">
<meta name="twitter:description" content="가입하고 공수 1번 저장하면 포인트를 받아요">
<meta name="twitter:image"       content="https://www.ongs1.co.kr/assets/og-invite.png">

<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preload" href="/assets/pretendard-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* 첫 페이지와 같은 프리텐다드 서브셋. 서브셋에 없는 글자는 CDN 프리텐다드로 넘어간다. */
@font-face{
  font-family:'PretendardSub';
  src:url('/assets/pretendard-subset.woff2') format('woff2-variations'),
      url('/assets/pretendard-subset.woff2') format('woff2');
  font-weight:45 930;
  font-style:normal;
  font-display:block;
}

:root{
  --accent:#8E53FD;
  --orange:#F75D21;
  --pink:#FF8FA3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{
  font-family:'PretendardSub','Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100svh;display:flex;justify-content:center;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

.frame{
  width:100%;max-width:390px;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;
}

/* ---------- 머리 ---------- */
.hero{width:100%;height:auto;border-radius:14px}
.logo{height:20px;width:auto}

.title{
  font-size:26px;font-weight:700;letter-spacing:-.7px;line-height:1.35;text-align:center;
}
.title em{font-style:normal;color:var(--accent)}

/* ---------- 받는 방법 ---------- */
.how{width:100%;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;display:flex;gap:8px;width:100%}
.steps li{
  flex:1;min-width:0;
  background:#141418;border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:12px 6px;text-align:center;
  font-size:14.5px;font-weight:600;letter-spacing:-.36px;line-height:1.3;
}
.steps li b{
  display:block;margin:0 auto 6px;width:22px;height:22px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;line-height:22px;
}
.pay{
  font-size:13.5px;letter-spacing:-.34px;line-height:1.55;color:rgba(255,255,255,.6);text-align:center;
}

/* ---------- 큰 버튼 ---------- */
.act{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.cta{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:56px;border:0;border-radius:14px;cursor:pointer;
  background:var(--accent);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:-.45px;
  transition:transform .14s ease, opacity .14s ease;
}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.note{font-size:13px;letter-spacing:-.33px;line-height:1.5;color:rgba(255,255,255,.6);text-align:center}
.notice{font-size:16px;font-weight:600;letter-spacing:-.4px;text-align:center}

.moving{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:-.35px;color:rgba(255,255,255,.8)}
.dots i{
  display:inline-block;width:6px;height:6px;border-radius:99px;margin:0 2px;
  background:var(--orange);animation:blink 1.1s infinite;
}
.dots i:nth-child(2){background:var(--pink);animation-delay:.16s}
.dots i:nth-child(3){background:var(--accent);animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- 초대 코드 칸 ---------- */
.codebox{
  width:100%;border-radius:14px;padding:16px;
  background:#141418;border:1px solid rgba(142,83,253,.45);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.codebox .lbl{font-size:13px;letter-spacing:-.33px;color:rgba(255,255,255,.6)}
.codebox .code{
  font-size:36px;font-weight:800;letter-spacing:6px;line-height:1.2;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:all;user-select:all;
}
.codebox.big .code{font-size:44px}
.copy{
  border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;
  border-radius:99px;padding:7px 16px;font-size:13.5px;font-weight:600;letter-spacing:-.34px;
}
.copy:active{transform:scale(.97)}
.codebox .msg{font-size:13.5px;font-weight:600;letter-spacing:-.34px;color:var(--accent);text-align:center}

/* ---------- 스토어 버튼 2개 (첫 페이지와 같은 모양) ---------- */
.stores{display:flex;gap:10px;align-items:center;width:100%;justify-content:center}
.store{
  width:160px;max-width:calc(50% - 5px);
  padding:5px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  overflow:hidden;border:1px solid transparent;
  transition:transform .14s ease, opacity .14s ease;
}
.store:active{transform:scale(.97)}
.store:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.store .ico{flex:none;display:block}
.store .tx{text-align:left;white-space:nowrap;letter-spacing:-.3px}
.store .tx small{display:block;font-size:12px;font-weight:400;line-height:1.1}
.store .tx strong{display:block;font-size:15px;font-weight:700;line-height:1.1}
.store--ios{background:#fff;color:#000}
.store--ios .tx small{color:rgba(0,0,0,.6)}
.store--aos{background:#000;border-color:rgba(255,255,255,.6);color:#fff}
.store--aos .tx small{color:rgba(255,255,255,.6)}

/* ---------- 코드 없는 일반 안내 ---------- */
.plain{text-align:center;display:flex;flex-direction:column;align-items:center}
.plain .l1{display:block;font-size:24px;font-weight:400;letter-spacing:-.6px;line-height:34px}
.plain .l2{display:block;font-size:32px;font-weight:600;color:var(--accent);letter-spacing:-.8px;line-height:44.8px}
.plain .sub span{display:block;font-size:14px;color:rgba(255,255,255,.6);letter-spacing:-.35px;line-height:22px}

.foot{font-size:11.5px;letter-spacing:-.29px;color:rgba(255,255,255,.32)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="frame">

  <!-- ===== 초대 화면 (코드가 맞을 때) ===== -->
  <img class="hero" id="v-hero" src="/assets/og-invite.png" alt="오늘공수 친구 초대" width="1200" height="630" hidden>

  <h1 class="title" id="v-title" hidden>친구가 <em>오늘공수</em>에<br>초대했어요</h1>

  <section class="how" id="v-how" aria-label="받는 방법" hidden>
    <ol class="steps">
      <li><b>1</b>앱 받기</li>
      <li><b>2</b>회원가입</li>
      <li><b>3</b>공수 1번 저장</li>
    </ol>
    <p class="pay">마치면 포인트가 바로 들어와요.<br>확인이 필요한 경우에만 최대 3일 걸려요.</p>
  </section>

  <!-- 아이폰 -->
  <div class="act" id="v-ios" hidden>
    <button type="button" class="cta" id="ios-go">앱 받기</button>
    <p class="note">누르면 초대 코드가 복사돼요.<br>가입한 뒤 붙여넣기 버튼을 눌러 주세요.</p>
  </div>

  <!-- 안드로이드 -->
  <div class="act" id="v-aos" hidden>
    <p class="moving" id="aos-moving"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>플레이스토어로 이동하고 있어요</p>
    <a class="cta" id="aos-go" href="https://play.google.com/store/apps/details?id=com.ongs.app" hidden>플레이스토어에서 받기</a>
  </div>

  <!-- PC · 기타 -->
  <div class="act" id="v-pc" hidden>
    <p class="notice">휴대폰에서 열어 주세요</p>
  </div>

  <div class="codebox" id="v-code" role="group" aria-label="초대 코드" hidden>
    <span class="lbl">초대 코드</span>
    <strong class="code" id="code-text"></strong>
    <button type="button" class="copy" id="code-copy">코드 복사</button>
    <p class="msg" id="code-msg" role="status" aria-live="polite" hidden></p>
  </div>

  <!-- ===== 코드 없는 일반 안내 (기본값 — 스크립트가 안 돌아도 이 화면) ===== -->
  <img class="logo" id="g-logo" src="/assets/logo-wordmark.png" alt="오늘공수" width="618" height="149">
  <div class="plain" id="g-copy">
    <h1><span class="l1">광고없이 공수 입력</span><span class="l2">1초면 끝!</span></h1>
    <p class="sub"><span>공수, 총액, 세후 금액까지</span><span>열자마자 현황이 한눈에</span></p>
  </div>

  <div class="stores" id="stores">
    <a class="store store--ios" id="btn-ios" href="https://apps.apple.com/app/id6783352967" rel="noopener">
      <svg class="ico" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 12.54c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3-.79-1.55.02-2.97.9-3.77 2.28-1.6 2.79-.41 6.92 1.15 9.18.76 1.11 1.67 2.35 2.86 2.31 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 3 .72 1.24-.02 2.02-1.13 2.78-2.24.88-1.29 1.24-2.54 1.26-2.6-.03-.01-2.41-.93-2.43-3.69M14.8 5.79c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.68-1.09 1.77-.96 2.81 1.02.08 2.06-.52 2.69-1.28"/></svg>
      <span class="tx"><small>App Store</small><strong>아이폰 다운로드</strong></span>
    </a>
    <a class="store store--aos" id="btn-aos" href="https://play.google.com/store/apps/details?id=com.ongs.app" rel="noopener">
      <svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.61 1.81a1 1 0 0 0-.42.83v18.72a1 1 0 0 0 .42.83l.1.06 10.48-10.48v-.06L3.71 1.75zM17.6 15.4l-3.4-3.4v-.06l3.4-3.4.08.05 4.15 2.36c1.18.67 1.18 1.77 0 2.44l-4.15 2.36zM16.51 16.6L13.03 13.1 2.5 23.63c.39.41 1.03.46 1.75.05zM16.51 7.4 4.25.32C3.53-.09 2.89-.04 2.5.37L13.03 10.9z"/></svg>
      <span class="tx"><small>Google Play</small><strong>안드로이드 다운로드</strong></span>
    </a>
  </div>

  <p class="foot">© 2026 오늘공수</p>

</div>

<script>
/* 분석 도구 · 쿠키 · 저장소를 쓰지 않는다. 주소 값은 textContent 로만 화면에 넣는다. */
(function () {
  'use strict';

  var APP_STORE = 'https://apps.apple.com/app/id6783352967';
  var PLAY_BASE = 'details?id=com.ongs.app';
  var CODE_RE   = /^[A-HJ-NP-Z2-9]{6}$/;

  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).hidden = false; }
  function hide(id){ $(id).hidden = true; }

  /* ---------- 코드 ---------- */
  var raw = '';
  try { raw = new URLSearchParams(location.search).get('c') || ''; } catch (e) {}
  var code = String(raw).trim().toUpperCase();
  if (!CODE_RE.test(code)) return;            /* 코드가 없거나 틀리면 일반 안내 그대로 */

  /* ---------- 기기 ---------- */
  var ua = navigator.userAgent || '';
  var os = /android/i.test(ua) ? 'android'
         : /iPad|iPhone|iPod/.test(ua) ? 'ios'
         : (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
         : 'other';

  /* ---------- 스토어 주소 (코드는 위 정규식을 통과한 값만) ---------- */
  var referrer = 'utm_source%3Dongs_invite%26utm_medium%3Dreferral%26invite%3D' + code;
  var playHttps  = 'https://play.google.com/store/apps/' + PLAY_BASE + '&referrer=' + referrer;
  var playMarket = 'market://' + PLAY_BASE + '&referrer=' + referrer;

  /* ---------- 초대 화면으로 전환 ---------- */
  hide('g-logo'); hide('g-copy');
  show('v-hero'); show('v-title'); show('v-how'); show('v-code');
  $('code-text').textContent = code;
  $('btn-ios').href = APP_STORE;
  $('btn-aos').href = playHttps;

  /* ---------- 복사 ---------- */
  function legacyCopy(text) {
    var ok = false, ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;';
    document.body.appendChild(ta);
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    ta.blur();
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text, cb) {
    var done = false;
    function finish(ok){ if (!done) { done = true; cb(ok); } }
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { finish(true); },
        function () { finish(legacyCopy(text)); }
      );
      setTimeout(function () { finish(legacyCopy(text)); }, 1500);   /* 응답이 없을 때 대비 */
    } else {
      finish(legacyCopy(text));
    }
  }

  function codeMsg(text) {
    var m = $('code-msg');
    m.textContent = text;
    m.hidden = false;
  }
  function askLongPress() {
    $('v-code').classList.add('big');
    codeMsg('길게 눌러 복사해 주세요');
    try { $('v-code').scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
  }

  $('code-copy').addEventListener('click', function () {
    copyText(code, function (ok) {
      if (ok) codeMsg('복사했어요'); else askLongPress();
    });
  });

  /* ---------- 아이폰 ---------- */
  if (os === 'ios') {
    show('v-ios');
    hide('stores');
    var busy = false;
    $('ios-go').addEventListener('click', function () {
      if (busy) return;
      busy = true;
      copyText('오늘공수 초대 코드: ' + code, function (ok) {
        if (ok) {
          location.href = APP_STORE;
        } else {
          askLongPress();
          setTimeout(function () { location.href = APP_STORE; }, 3000);  /* 코드를 볼 시간을 준 뒤 이동 */
        }
        setTimeout(function () { busy = false; }, 1000);
      });
    });
    return;
  }

  /* ---------- 안드로이드 ---------- */
  if (os === 'android') {
    show('v-aos');
    hide('stores');
    $('aos-go').href = playHttps;
    function fallback() {
      hide('aos-moving');
      show('aos-go');
      $('v-code').classList.add('big');
    }
    setTimeout(fallback, 2000);                /* 2초 안에 스토어가 안 열리면 버튼 + 큰 코드 */
    window.addEventListener('pageshow', function (e) { if (e.persisted) fallback(); });
    location.href = playMarket;
    return;
  }

  /* ---------- PC · 기타 ---------- */
  show('v-pc');
})();
</script>
</body>
</html>
